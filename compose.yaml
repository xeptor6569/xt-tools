# xt-tools production compose file.
#   docker compose up -d          # uses the published image
#   docker compose up -d --build  # builds locally (needed for a custom BASE_PATH)
# Settings come from .env (copy .env.example).

services:
  tools:
    image: ghcr.io/xeptor6569/xt-tools:${XT_TAG:-latest}
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
        SITE_URL: ${SITE_URL:-}
        VERSION: ${VERSION:-dev}
    ports:
      - '${XT_BIND:-0.0.0.0}:${XT_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Override the security headers without rebuilding (keep the csp.conf include):
    # volumes:
    #   - ./my-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
