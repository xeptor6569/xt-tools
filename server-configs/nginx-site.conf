# Site block for a host nginx. Copy csp.conf from this directory to
# /etc/nginx/snippets/csp.conf (the include below). Point root at the
# unzipped site. The container's own config is deploy/nginx/.

server {
    listen 80;
    server_name _;
    root /var/www/xt-tools;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    access_log off;

    include mime.types;
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/manifest+json;

    error_page 404 /404.html;

    location ~ /\. {
        include /etc/nginx/snippets/csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404;
    }

    location ~ /_astro/ {
        include /etc/nginx/snippets/csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ (/sw\.js|/workbox-[^/]*\.js|\.webmanifest)$ {
        include /etc/nginx/snippets/csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ (/data/[^/]+\.[a-z0-9]+|\.wasm)$ {
        include /etc/nginx/snippets/csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
