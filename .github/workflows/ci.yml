name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  npm_config_fund: 'false'
  npm_config_update_notifier: 'false'

jobs:
  checks:
    name: Validate, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate tools
        run: npm run validate-tools -- --strict
      - name: Check licenses
        run: npm run check-licenses
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (base path /)
        run: npm run build
      - name: Build (base path /tools/)
        run: npm run build
        env:
          BASE_PATH: /tools/

  scaffold:
    name: Scaffolding loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scaffold one tool per template, plus one with a worker
        run: |
          for t in two-pane text-transform generator file-processor diff reference-table; do
            npm run new-tool -- "ci-$t" --name "CI $t" --category text \
              --description "Temporary tool created by CI to test the $t template." --template "$t" --yes
          done
          npm run new-tool -- ci-worker --name "CI worker" --category text \
            --description "Temporary tool created by CI to test the worker template." --worker --yes
      - name: The new tools pass every check without other edits
        run: |
          npm run validate-tools
          npm run check
          npm run lint
          npm test
          npm run build
          for id in $(ls src/tools | grep '^ci-'); do
            test -f "dist/tools/$id/index.html"
            grep -q "\"$id\"" dist/search-index.json
            grep -q "tools/$id/" dist/index.html
            grep -q "tools/$id/" dist/category/text/index.html
          done
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: End-to-end tests cover the new tools
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/tools.spec.ts
      - name: Remove them again
        run: |
          for id in $(ls src/tools | grep '^ci-'); do npm run remove-tool -- "$id" --yes; done
          test -z "$(ls src/tools | grep '^ci-')"
          test -z "$(ls src/pages/tools | grep '^ci-')"
          npm run validate-tools -- --strict

  image:
    name: Image (base ${{ matrix.base }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: ['/', '/tools/']
    env:
      BASE_PATH: ${{ matrix.base }}
      XT_SITE_IMAGE: xt-tools:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: xt-tools:ci
          build-args: |
            BASE_PATH=${{ matrix.base }}
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.base == '/' && 'root' || 'subpath' }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.base == '/' && 'root' || 'subpath' }}
      - name: Smoke test (read-only, no capabilities)
        run: node scripts/smoke-test.ts --image xt-tools:ci --base "$BASE_PATH"
      - name: End-to-end tests on a network with no internet access
        run: |
          docker compose -f compose.dev.yaml --profile test build e2e
          docker compose -f compose.dev.yaml --profile test run --rm e2e
      - name: Stop containers
        if: always()
        run: docker compose -f compose.dev.yaml --profile test down
      - name: Lighthouse (performance, accessibility, best practices)
        if: matrix.base == '/'
        run: |
          docker run -d --rm --name xt-lh --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 xt-tools:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse reports
        if: always() && matrix.base == '/'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.base == '/' && 'root' || 'subpath' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Scan image for vulnerabilities
        if: matrix.base == '/'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xt-tools:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
