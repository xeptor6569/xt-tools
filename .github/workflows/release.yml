name: Release

# Publishes images to GHCR. A push to main tags `edge` and `sha-<short>`.
# A `v*` tag also tags `X.Y.Z`, `X.Y` and `latest`, and attaches the static
# site zip, SHA256SUMS and an SBOM to the GitHub release.
#
# Runs on GitHub-hosted runners. Multi-arch images need QEMU, and the
# self-hosted runners are linux/amd64 only. The first push creates a private
# GHCR package; set it to public once on the package page.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  IMAGE: ghcr.io/xeptor6569/xt-tools

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  site:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the root-path site
        run: npm run build
        env:
          VERSION: ${{ github.ref_name }}
      - name: SBOM for the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Pack the site and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="xt-tools-${version}-site"
          mkdir -p "$stage/server-configs"
          cp -a dist/. "$stage/"
          cp -a server-configs/. "$stage/server-configs/"
          cp build/server/csp.txt build/server/csp.conf build/server/apache.htaccess build/server/Caddyfile \
            "$stage/server-configs/"
          zip -r -q "${stage}.zip" "$stage"
          sha256sum "${stage}.zip" sbom.spdx.json > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Static site, checksums and the image SBOM. The container image is \`${IMAGE}:${version}\`, \`${IMAGE}:${version%.*}\` and \`${IMAGE}:latest\`." \
            "xt-tools-${version}-site.zip" \
            SHA256SUMS \
            sbom.spdx.json
