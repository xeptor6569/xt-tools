# xt-tools nginx config for nginxinc/nginx-unprivileged (runs as UID 101).
# Writable paths live under /tmp, so the container can run with a read-only
# root filesystem and a tmpfs on /tmp.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    include      /etc/nginx/snippets/mime-extra.conf;
    default_type application/octet-stream;
    charset      utf-8;
    charset_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

    # Privacy: no access log by default. Self-hosters can enable it by
    # mounting their own copy of this file.
    access_log off;

    server_tokens      off;
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    absolute_redirect  off;
    port_in_redirect   off;

    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json application/wasm image/svg+xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
