# xt-tools site. Locations use regexes so the same config works under any
# base path (BASE_PATH is compiled into the site and handled by base.conf).

server {
    # IPv4 only: [::] fails to bind on hosts with IPv6 disabled. Add
    # `listen [::]:8080;` in your own copy if you need IPv6 inside the container.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Redirect / to the base path when one is configured (generated).
    include /etc/nginx/snippets/base.conf;

    # Never serve dotfiles.
    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # Hashed build assets (including WASM imported with ?url).
    location ~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker and manifest: always revalidate so updates arrive.
    location ~ (/sw\.js|/workbox-[^/]*\.js|\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Datasets (versioned file names) and unhashed WASM.
    location ~ (/data/[^/]+\.[a-z0-9]+|\.wasm)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Icons.
    location ~ \.(svg|png|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML and everything else: revalidate on every visit.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
