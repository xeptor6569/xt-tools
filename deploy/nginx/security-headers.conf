# Security headers, included in EVERY location block: nginx drops inherited
# add_header directives in any location that adds its own.
#
# You can override this file with a volume mount without rebuilding. Keep the
# csp.conf include: it carries the policy generated from the build's hashes.

include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), clipboard-read=(self), local-fonts=(self), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), browsing-topics=()" always;
